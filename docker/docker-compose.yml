name: robot-labs-stand

services:
  # ====== ВАРИАНТ 1: полный живой стенд ======
  # рука + перелёт камеры (slerp) + трекинг маркера (RANSAC) + IK-сервер
  # + мост из ноутбука. Foxglove Studio: ws://localhost:9090
  stand:
    build:
      context: ..
      dockerfile: docker/Dockerfile.ros2
    ports:
      - "9090:9090"   # rosbridge (Foxglove)
      - "8977:8977"   # мост из ноутбука (вариант 2)

  # ====== ВАРИАНТ 2: мост под панель ноутбука ======
  # углы руки задаёт панель ноутбука (TCP 8977), камера летает сама,
  # Foxglove всё равно доступен. Запускать один из двух сервисов:
  #   docker compose up -d stand     # стенд с IK-сервером
  #   docker compose up -d bridge   # мост под панель ноутбука
  bridge:
    build:
      context: ..
      dockerfile: docker/Dockerfile.ros2
    ports:
      - "9090:9090"
      - "8977:8977"
    entrypoint: ["/stand/run_bridge.sh"]
