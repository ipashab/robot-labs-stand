name: robot-labs-stand

# Логи контейнеров ограничены: без лимита разовый потоковый лог (например,
# ошибки конвертации больших сообщений) может занять десятки гигабайт.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# Одновременный запуск: варианты разделяют одну docker-сеть проекта,
# поэтому ROS_DOMAIN_ID у них разный - узлы не видят друг друга и
# не конфликтуют за /tf и /joint_states. Порт rosbridge/моста задаётся
# переменными (вдруг порты заняты):
#   ROSBRIDGE_PORT=9090 BRIDGE_PORT=8977 docker compose up -d stand

services:
  # ====== ВАРИАНТ 1: полный живой стенд ======
  # рука (URDF) + перелёт камеры (slerp) + трекинг маркера (RANSAC)
  # + IK-сервер + мост из ноутбука + rosbridge.
  # Foxglove: ws://localhost:${ROSBRIDGE_PORT:-9090}
  # Мост ноутбука: localhost:${BRIDGE_PORT:-8977} (ноутбук пишет сюда)
  stand:
    build:
      context: ..
      dockerfile: docker/Dockerfile.ros2
    environment:
      - ROS_DOMAIN_ID=53
    logging: *default-logging
    ports:
      - "${ROSBRIDGE_PORT:-9090}:9090"
      - "${BRIDGE_PORT:-8977}:8977"

  # ====== ВАРИАНТ 2: мост под панель ноутбука ======
  # Тот же образ, но без marker_tracker/ik_server: суставы руки
  # задаёт панель ноутбука (мост), камера летает сама, Foxglove доступен.
  # Вариант можно запускать одновременно со стендом - домены разные
  # и порты другие; или отдельно, когда полный стенд не нужен.
  bridge:
    build:
      context: ..
      dockerfile: docker/Dockerfile.ros2
    environment:
      - ROS_DOMAIN_ID=54
    logging: *default-logging
    ports:
      - "${ROSBRIDGE_PORT_ALT:-9190}:9090"
      - "${BRIDGE_PORT_ALT:-8177}:8977"
    entrypoint: ["/stand/run_bridge.sh"]

  # ====== ПРОСМОТРЩИК В БРАУЗЕРЕ (замена Foxglove) ======
  # Trillium - опенсорсный веб-форк Foxglove v1.87 (для сред, где
  # Foxglove недоступен). Открывается в любом браузере:
  #   http://localhost:8080
  # Подключение внутри приложения: "Rosbridge connection" ->
  #   ws://localhost:9090  (вариант 1, стенд)
  #   ws://localhost:9190  (вариант 2, мост)
  # Панель 3D: TF-кадры, /robot_description, /stand/arm_markers;
  # инструмент "Publish pose" в 3D-панели публикует /move_base_simple/goal.
  # Образ собран под amd64: на Apple Silicon стартует через Rosetta
  # (внутри - статика на Caddy, оверхед эмуляции не заметен).
  viewer:
    image: cloudv0/trillium:latest
    platform: linux/amd64
    logging: *default-logging
    ports:
      - "${VIEWER_PORT:-8080}:8080"
    volumes:
      # готовая раскладка панелей: 3D с рукой/маркерами/TF, кадр камеры,
      # график телеметрии; Publish pose уже настроен на /move_base_simple/goal.
      # Entrypoint образа встраивает файл в index.html один раз при создании
      # контейнера, поэтому правку раскладки видно после
      #   docker compose up -d --force-recreate viewer
      # (обычный restart оставляет старую версию). Дальше раскладка лежит в
      # localStorage браузера (ключ studio.layout): при повторном заходе
      # берётся оттуда, сброс - localStorage.clear() + перезагрузка страницы.
      - ./trillium-layout.json:/foxglove/default-layout.json
